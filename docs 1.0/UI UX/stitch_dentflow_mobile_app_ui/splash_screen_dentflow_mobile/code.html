<script>
  (function initSplashDelight() {
    const progressBar = document.getElementById('splash-progress');
    const percentLabel = document.getElementById('splash-percent');
    const statusText = document.getElementById('splash-status-text');
    const nextBtn = document.getElementById('btn-next-screen');

    let current = 48;
    const stages = [
      { at: 72, text: "Sinkronisasi profil pasien..." },
      { at: 94, text: "Menyiapkan odontogram..." },
      { at: 100, text: "Siap digunakan" }
    ];

    const timer = setInterval(() => {
      if (current < 100) {
        current += Math.floor(Math.random() * 8) + 4;
        if (current > 100) current = 100;

        if (progressBar) progressBar.style.width = current + '%';
        if (percentLabel) percentLabel.textContent = current + '%';

        const match = stages.find(s => current <= s.at);
        if (match && statusText) {
          statusText.textContent = match.text;
        }

        if (current === 100) {
          clearInterval(timer);
          if (nextBtn) {
            nextBtn.classList.remove('bg-surface-container-lowest');
            nextBtn.classList.add('bg-primary-container', 'text-on-primary');
            const sublabel = nextBtn.querySelector('.text-outline');
            if (sublabel) sublabel.classList.replace('text-outline', 'text-on-primary-fixed-variant');
          }
        }
      }
    }, 450);

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        nextBtn.style.transform = 'scale(0.97)';
        setTimeout(() => {
          nextBtn.style.transform = '';
        }, 150);
      });
    }
  })();
